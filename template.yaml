AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hazel - Lightweight update server for Electron apps

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Parameters:
  ImageUri:
    Type: String
    Description: ECR image to run; scripts/deploy.sh builds, pushes and sets it
  SSMParameterPrefix:
    Type: String
    Default: '/sst/hazel/production/secrets'
    Description: SSM parameter prefix for configuration values
  Pre:
    Type: String
    Default: ''
    Description: Set to '1' to cache only pre-releases (optional, can use SSM instead)
  Interval:
    Type: String
    Default: '15'
    Description: Cache refresh interval in minutes
  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional extra hostname for the API, such as updates.curvo.ai
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone for CustomDomainName

Rules:
  CustomDomainNeedsZone:
    RuleCondition: !Not [!Equals [!Ref CustomDomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, '']]
        AssertDescription: Set HostedZoneId when CustomDomainName is set

# The custom domain is an extra way in, never a replacement: installed
# Companions have the execute-api URL built in, so that endpoint must stay
# enabled. stack-policy.json stops the API itself being replaced or deleted.
Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  HazelFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - x86_64
      Environment:
        Variables:
          PORT: 8080
          SSM_PARAMETER_PREFIX: !Ref SSMParameterPrefix
          PRE: !Ref Pre
          INTERVAL: !Ref Interval
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameters
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SSMParameterPrefix}/*'
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootHttpApiEvent:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  CustomDomainCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomainName
          HostedZoneId: !Ref HostedZoneId

  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomDomainCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  CustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    DependsOn: ServerlessHttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref CustomDomain
      Stage: $default

  CustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId

Outputs:
  HazelUrl:
    Description: URL for Hazel update server
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
  HazelFunctionArn:
    Description: Hazel Lambda Function ARN
    Value: !GetAtt HazelFunction.Arn
  HazelApiId:
    Description: HTTP API Gateway ID
    Value: !Ref ServerlessHttpApi
  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Extra URL for Hazel; HazelUrl keeps working
    Value: !Sub 'https://${CustomDomainName}/'
