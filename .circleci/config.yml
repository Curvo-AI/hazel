version: 2
jobs:
  build:
    docker:
      - image: cimg/node:24.11

    working_directory: ~/repo

    steps:

      - checkout

      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "package-lock.json" }}

      - run: npm ci

      - save_cache:
          paths:
            - ~/.npm
          key: v2-dependencies-{{ checksum "package-lock.json" }}

      - run: npm test
