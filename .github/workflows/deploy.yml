name: Deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy (production waits for approval)
        type: choice
        options:
          - hazel-update-server-test
          - hazel-update-server
        default: hazel-update-server-test
      dry-run:
        description: Show the change set without deploying (the image is still pushed)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a deploy part way: the script rolls back on its own failures only
concurrency:
  group: ${{ github.workflow }}-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each environment's AWS role only trusts that environment, and
    # production requires a reviewer to approve the run
    environment: ${{ inputs.stack == 'hazel-update-server' && 'production' || 'test' }}
    permissions:
      contents: read
      id-token: write # assume the AWS deploy role through GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - run: scripts/deploy.sh "$MODE" "$STACK"
        env:
          MODE: ${{ inputs.dry-run && '--dry-run' || '--yes' }}
          STACK: ${{ inputs.stack }}
